<!--
    Source for AppIcon-1024.png. Same mark and blue as the browser extension
    (apps/browser-extension/icons/icon-128.svg), full-bleed: iOS applies its own
    corner mask, so this must not carry rounded corners of its own.

    Re-render with:
      rsvg-convert -w 1024 -h 1024 AppIcon.svg | magick png:- -background '#3B82F6' \
        -alpha remove -alpha off AppIcon-1024.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" fill="#3b82f6"/>
  <path d="M32 64l22 22L96 42" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
